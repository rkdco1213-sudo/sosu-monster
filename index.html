<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#86d1bd">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소수몬스터">
<title>소수 몬스터 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&family=IBM+Plex+Mono:wght@700&display=swap">
<style>
/* Layout: one sunny mint handheld centered on a warm cream page; 160x144 pixel screen in a soft navy bezel, control deck with D-pad, START/SELECT and B/A below */
:root{
  --night:#fff4df;
  --night-2:#e3f4ef;
  --shell:#86d1bd;
  --shell-hi:#b4e6d8;
  --shell-dark:#5aa893;
  --bezel:#3f4a68;
  --ink:#3b2f4a;
  --paper:#fffaf0;
  --muted:#7a6f86;
  --btn:#3f4a68;
  --a:#f27a68;
  --label:#2c5f54;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;
  background:radial-gradient(120% 70% at 50% 0%,var(--night-2),var(--night) 70%);
  color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 28px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,6vw,34px);margin:0;line-height:1;text-wrap:balance}
header.top h1 .pt{color:var(--a)}
header.top p{margin:5px 0 0;color:var(--muted);font-size:14px}
.top-btns{display:flex;gap:8px}
.chip-btn{font-family:var(--f-body);font-size:15px;background:var(--paper);color:var(--ink);border:2px solid #e2cfae;border-radius:999px;padding:6px 14px;cursor:pointer}
.chip-btn:hover{border-color:var(--label)}
button:focus-visible{outline:3px solid #f8d030;outline-offset:2px}

.device{
  background:linear-gradient(160deg,var(--shell-hi),var(--shell) 30%,var(--shell) 80%,var(--shell-dark));
  border-radius:20px 20px 52px 20px;padding:16px 16px 22px;
  box-shadow:0 2px 0 rgba(255,255,255,.5) inset,0 -6px 0 rgba(0,0,0,.12) inset,0 14px 30px rgba(90,70,40,.18);
  display:flex;flex-direction:column;gap:12px;
}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--label)}
.hud .lv{font-family:var(--f-mono);font-weight:700;font-size:14px;background:var(--ink);color:#f8d030;padding:3px 9px;border-radius:6px}
.hpbox{flex:1 1 150px;min-width:0;display:flex;align-items:center;gap:8px}
.hpbar{flex:1;height:10px;background:var(--ink);border-radius:5px;padding:2px;min-width:60px}
.hpbar i{display:block;height:100%;border-radius:3px;background:#48c048;transition:width .4s}
.hpbar i.low{background:#f8c030}.hpbar i.crit{background:#e84838}
.hpnum{font-family:var(--f-mono);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.hud .meta{white-space:nowrap}

.bezel{background:var(--bezel);border-radius:10px 10px 34px 10px;padding:14px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bezel-top{align-self:stretch;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#b8c0d8}
.bezel-top .led{width:8px;height:8px;border-radius:50%;background:#e84838;box-shadow:0 0 6px #e84838}
.bezel-top .line{flex:1;height:2px;background:linear-gradient(90deg,#f27a68,#f8d030,#86d1bd)}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;max-width:100%;touch-action:manipulation;cursor:pointer}
.brand{font-family:var(--f-display);font-size:18px;color:var(--label);letter-spacing:.04em;padding-left:4px}
.brand b{font-weight:400;color:#e2604a}

.deck{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-top:4px}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)}
.dpad button{background:var(--btn);border:0;color:#b8c0d8;font-size:16px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 0 #2a3248}
.dpad button.on,.dpad button:active{background:#56627f}
.dpad .u{grid-column:2;grid-row:1;border-radius:7px 7px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:7px 0 0 7px}
.dpad .c{grid-column:2;grid-row:2;background:var(--btn)}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 7px 7px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 7px 7px}
.mid{display:flex;justify-content:center;gap:14px;align-self:end;padding-bottom:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--label)}
.pill button{width:46px;height:14px;border-radius:7px;border:0;background:var(--btn);transform:rotate(-24deg);cursor:pointer;box-shadow:0 2px 0 #2a3248}
.ab{display:flex;gap:12px;align-items:flex-start;transform:rotate(-20deg)}
.ab .k{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--label)}
.ab .k:last-child{margin-top:-18px}
.ab button{width:58px;height:58px;border-radius:50%;border:0;background:var(--a);color:#fffaf0;font-family:var(--f-mono);font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 4px 0 #c0503f;touch-action:none}
.ab button:active{transform:translateY(3px);box-shadow:0 1px 0 #c0503f}
.ab small{font-family:var(--f-body);font-size:11px;font-weight:400;letter-spacing:0}

.modal{position:fixed;inset:0;background:rgba(60,50,40,.45);display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:20}
.sheet{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:2px solid #6888c8;outline-offset:-10px;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px 20px 22px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 4px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:20px;margin:16px 0 6px}
.sheet p,.sheet li{line-height:1.6;font-size:15px}
.sheet p{margin:6px 0}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet .sub{color:var(--muted);font-size:14px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:12px 0}
.dex .card{border:2px solid var(--ink);border-radius:8px;padding:8px 6px;text-align:center;background:#eeeadc}
.dex canvas{width:96px;height:96px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:0 auto}
.dex .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.dex .nm{font-size:15px}
.dex .zone{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--ink);color:var(--paper);border-radius:8px;padding:8px;text-align:center;min-width:0}
.stats b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;color:#f8d030}
.stats span{font-size:13px}
.row-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.row-btns button{flex:1 1 140px;font-family:var(--f-body);font-size:16px;border-radius:8px;padding:10px;cursor:pointer;border:2px solid var(--ink)}
.close{background:var(--ink);color:var(--paper)}
.reset{background:transparent;color:var(--ink)}
.reset.armed{background:#e84838;color:#fff;border-color:#e84838}
footer{color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#screen{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (max-width:440px){
  .deck{grid-template-columns:auto auto;justify-content:space-between;row-gap:6px}
  .mid{grid-column:1 / -1;order:3;padding-bottom:0}
  .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .ab button{width:52px;height:52px}
  .device{padding:12px 12px 16px}
  .bezel{padding:10px 8px 8px}
  .top-btns{flex-wrap:wrap}
}
@media (pointer:coarse){footer{display:none}}
@media (min-width:700px) and (orientation:portrait){.wrap{max-width:720px}}
@media (max-height:760px) and (orientation:portrait){header.top p{display:none}}
@media (orientation:landscape) and (max-height:820px){
  .wrap{max-width:1100px;gap:8px}
  body{padding-block:8px 8px}
  header.top p{display:none}
  header.top h1{font-size:22px}
  footer{display:none}
  .device{display:grid;grid-template-columns:auto minmax(200px,1fr);grid-template-rows:auto 1fr auto;column-gap:18px;row-gap:8px;align-items:center;padding:10px 14px 14px}
  .hud{grid-column:1 / -1}
  .bezel{grid-column:1;grid-row:2 / 4}
  .brand{grid-column:2;grid-row:2;align-self:end;text-align:center}
  .deck{grid-column:2;grid-row:3;align-self:start}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1>소수 몬스터 탐험<span class="pt">.</span></h1>
      <p>4학년 소수의 덧셈과 뺄셈</p>
    </div>
    <div class="top-btns">
      <button class="chip-btn" id="dexBtn" type="button">도감·기록</button>
      <button class="chip-btn" id="helpBtn" type="button">하는 법</button>
      <button class="chip-btn" id="sndBtn" type="button">소리 켜짐</button>
      <button class="chip-btn" id="fsBtn" type="button">전체 화면</button>
    </div>
  </header>

  <div class="device">
    <div class="hud">
      <span class="lv" id="lv">Lv.1</span>
      <div class="hpbox"><span>체력</span><div class="hpbar"><i id="hpFill" style="width:100%"></i></div><span class="hpnum" id="hpNum">30/30</span></div>
      <span class="meta" id="meta">도감 0/6</span>
    </div>
    <div class="bezel" id="bezel">
      <div class="bezel-top"><span class="led"></span><span class="line"></span><span>DOT · COLOR</span></div>
      <canvas id="screen" width="320" height="288" aria-label="게임 화면"></canvas>
    </div>
    <div class="brand">소수 탐험기 <b>COLOR</b></div>
    <div class="deck">
      <div class="dpad" aria-label="방향 버튼">
        <button class="u" data-dir="up" type="button" aria-label="위">▲</button>
        <button class="l" data-dir="left" type="button" aria-label="왼쪽">◀</button>
        <span class="c"></span>
        <button class="r" data-dir="right" type="button" aria-label="오른쪽">▶</button>
        <button class="d" data-dir="down" type="button" aria-label="아래">▼</button>
      </div>
      <div class="mid">
        <div class="pill"><button id="selBtn" type="button" aria-label="하는 법"></button>SELECT</div>
        <div class="pill"><button id="startBtn" type="button" aria-label="도감"></button>START</div>
      </div>
      <div class="ab">
        <div class="k"><button id="bBtn" type="button" aria-label="B 버튼">B</button><small>도망</small></div>
        <div class="k"><button id="aBtn" type="button" aria-label="A 버튼">A</button><small>확인</small></div>
      </div>
    </div>
  </div>
  <footer>키보드: 방향키 이동 · Z 또는 스페이스 = A · X = B · 배틀에서 1~4로 바로 답하기<br>화면의 보기를 직접 눌러도 돼요.</footer>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const LW=160,LH=144,TS=16;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scr=$('#screen'),mx=scr.getContext('2d');mx.imageSmoothingEnabled=false;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g]};
const [buf,bx]=mk(LW,LH);
const K='#3b2f4a';

/* ================= 지도 ================= */
const TOWN=[
'TTTTTTTTTTTTTTTTTTTTTTTT',
'T""""""..GGGGGG..;;;;;;T',
'T""""""..GGGGGG..;;;;;;T',
'T""""""..GGGGGG..;;;;;;T',
'T""""""..GGDDGG..;;;;;;T',
'T""""""f..f,f....;;;;;;T',
'T"""""",,,,,,,,,,;;;;;;T',
'T""""""S...,....S;;;;;;T',
'T""""""....,.....;;;;;;T',
'TLLLLLLf...,S..f.LLLLLLT',
'T.....,,,,,,,,,,,,,....T',
'T.HHHH,....,..CCCC.....T',
'T.HHHH,....,..CCCC.....T',
'T.HEHH,....,..CRCC.....T',
'T..,..,....,...,.S.....T',
'T..,,,,,,,,,,,,,..~~~~~T',
'TTf.......,......f~~~~~T',
'TT=========,.......~~~~T',
'TTT....f..,,,....f.....T',
'TTTTTTTTTTTTTTTTTTTTTTTT'];
const GYM=[
'XXXXXXXXXXX',
'XO_______OX',
'X_________X',
'XOOOO_OOOOX',
'X_________X',
'X_________X',
'XOO_____OOX',
'X_________X',
'X_________X',
'XOO_____OOX',
'X_________X',
'X_________X',
'XXXXXMXXXXX'];
const HOME=[
'YYNYYYYNYY',
'ZZVVVVVVZZ',
'ZZwZZwZwZZ',
'wwwwwwwwZZ',
'wwwwwwwwww',
'wZZZZwwwww',
'wwZZwwwwZZ',
'wwwwwwwwww',
'VVVVmVVVVV'];
const MAPS={
  home:{rows:HOME,border:'K',name:'우리 집',clamp:true,walk:new Set(['w','m']),buildings:[],
    props:[{kind:'rug',x:1,y:4,w:5,h:4},{kind:'shelf',x:0,y:1,w:2,h:2},{kind:'tv',x:3,y:2,w:2,h:1},{kind:'plant',x:6,y:2,w:1,h:1},
      {kind:'stairs',x:8,y:1,w:2,h:3},{kind:'table',x:2,y:5,w:2,h:2},{kind:'chairL',x:1,y:5,w:1,h:1},{kind:'chairR',x:4,y:5,w:1,h:1},{kind:'pc',x:8,y:6,w:2,h:1}]},
  town:{rows:TOWN,border:'T',name:'소수 마을',walk:new Set(['.',',','"',';','f','D','R','E']),
    buildings:[{kind:'house',x:2,y:11,w:4,h:3},{kind:'heal',x:14,y:11,w:4,h:3},{kind:'gym',x:9,y:1,w:6,h:4}]},
  gym:{rows:GYM,border:'X',name:'소수 체육관',walk:new Set(['_','M']),buildings:[]}
};
for(const m of Object.values(MAPS)){m.props=m.props||[];m.w=Math.max(...m.rows.map(r=>r.length));m.h=m.rows.length;m.grid=m.rows.map(r=>r.padEnd(m.w,m.border).split(''))}
const tileAt=(m,x,y)=>(x<0||y<0||x>=m.w||y>=m.h)?m.border:m.grid[y][x];
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};

/* ================= 타일 그림 ================= */
const R=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
function paint(g,rows,pal,ox=0,oy=0){rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=pal[r[x]];if(c)R(g,ox+x,oy+y,1,1,c)}})}
const hash=(x,y,k)=>(((x*73856093)^(y*19349663)^(k*83492791))>>>0);
const TC={};
const tc=(key,fn)=>{if(!TC[key]){const [c,g]=mk(16,16);fn(g);TC[key]=c}return TC[key]};
const COL={grass:'#b8e070',mark:'#98c850',dot:'#a8d460',path:'#e8ecb8',pathMark:'#c8d090',water:'#4c80d8',wave:'#a0d0f8',waterDark:'#3868c0'};
function grass(g,v){R(g,0,0,16,16,COL.grass);for(let y=1;y<16;y+=4)for(let x=(y%8===1?1:3);x<16;x+=4)R(g,x,y,1,1,COL.dot);if(v===1){R(g,3,4,1,2,COL.mark);R(g,5,3,1,2,COL.mark)}if(v===2){R(g,10,10,1,2,COL.mark);R(g,12,9,1,2,COL.mark)}}
const TUFT=['..o...o.','.olo.olo','.olgoolo','olgggolo','olggggo.','.oggggo.','..oooo..','........'];
const TREE=[
'.......oo.......',
'......ollo......',
'.....olggdo.....',
'....olgggddo....',
'.....olggdo.....',
'....olglggdo....',
'...olggggdddo...',
'..olglgggddddo..',
'...olgggdddo....',
'..olgglgggddddo.',
'.olggggggddddddo',
'olgglggggddddddo',
'.oodgggddddddoo.',
'...ooddddddoo...',
'......otto......',
'......otto......'];
const FL0=['..r..','.rrr.','rryrr','.rrr.','..r..'], FL1=['.r.r.','rrrrr','.ryr.','rrrrr','.r.r.'];
/* ===== 교체용 그림 슬롯: assets/ 폴더에 같은 이름의 PNG를 넣으면 기본 그림 대신 사용 ===== */
const ART_SLOTS={
  tiles:['grass','flower','path','path_set','tree_set','tall_grass_1_set','tall_grass_2_set','water_set','tall_grass_1','tall_grass_2','tree','water','fence','sign','ledge','gym_floor','gym_wall','gym_statue','gym_mat','home_floor','home_wall','home_window','home_wainscot','home_mat'],
  buildings:['house','heal','gym'],
  props:['rug','shelf','tv','plant','stairs','table','chairL','chairR','pc'],
  characters:['hero','hero_back','heroine','heroine_back','hero_girl','hero_back_girl','trainer1','trainer2','leader','mom'],
  monsters:['jeomkong','banjjak','ttokttak','baekbun','jariba','sosuri','bungeo','dotdragon'],
  screens:['title_bg']
};
const ART={};
const artLoad=Promise.all(Object.entries(ART_SLOTS).flatMap(([dir,names])=>names.map(n=>new Promise(res=>{
  const im=new Image();im.onload=()=>{ART[dir+'/'+n]=im;res()};im.onerror=()=>res();im.src='assets/'+dir+'/'+n+'.png';
}))));
const ART_ALIAS={'characters/heroine':'characters/hero_girl','characters/heroine_back':'characters/hero_back_girl'};
const art=n=>ART[n]||(ART_ALIAS[n]&&ART[ART_ALIAS[n]])||null;
const TILE_ART={'.':'grass',H:'grass',C:'grass',G:'grass',D:'grass',R:'grass',E:'grass',f:'flower',',':'path','"':'tall_grass_1',';':'tall_grass_2',T:'tree','~':'water','=':'fence',S:'sign',L:'ledge',

/* ================= 문제 만들기 (1/100 단위 정수) ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const fmt=h=>{let s=(h/100).toFixed(2);s=s.replace(/0+$/,'').replace(/\.$/,'');return s};
const dpOf=h=>h%10!==0?2:(h%100!==0?1:0);
function oneDp(){let t;do{t=rnd(11,99)}while(t%10===0);return t*10}
function twoDp(){let t;do{t=rnd(101,999)}while(t%10===0);return t}
/* 난이도: 1 초록 풀숲 · 2 청록 풀숲 · 3 트레이너 · 4 관장 */
const d0=h=>h%10,d1=h=>Math.floor(h/10)%10;
function basic(level){
  let a,b,op=Math.random()<.5?'+':'-';
  if(level===1){a=oneDp();b=oneDp()}
  else if(Math.random()<.5){a=oneDp();b=twoDp();if(Math.random()<.5)[a,b]=[b,a]}
  else{a=twoDp();b=twoDp()}
  if(op==='-'){if(a===b)b=a>200?a-rnd(11,99):a+rnd(11,99);if(a<b)[a,b]=[b,a]}
  return{a,b,op};
}
function hardTrainer(){
  // 받아올림·받아내림이 꼭 생기는 두 자리 소수, 10보다 큰 소수, 자릿수가 다른 뺄셈
  const t=rnd(0,2);let a,b,op;
  for(let k=0;k<200;k++){
    if(t===0){op='+';a=twoDp();b=twoDp();if(d0(a)+d0(b)>=10&&d1(a)+d1(b)+1>=10)break}
    else if(t===1){op='-';a=rnd(1001,1999);b=twoDp();if(a%10&&b%10&&d0(a)<d0(b)&&d1(a)<d1(b)+1&&a>b)break}
    else{op='-';a=oneDp()+rnd(1,9)*100;b=twoDp();if(a>b&&a%100)break}
  }
  return{a,b,op};
}
function hardBoss(){
  const t=rnd(0,3);let a,b,op;
  if(t===0){op='-';a=rnd(3,12)*100;do{b=twoDp()}while(b>=a)}                       // 자연수 − 소수 (7 − 3.46)
  else if(t===1){op='-';a=rnd(10,19)*100+rnd(1,8);do{b=rnd(101,999)}while(b%10===0||d0(b)<=d0(a))} // 0을 건너 받아내림 (10.03 − 4.58)
  else if(t===2){op='+';a=rnd(1,9)*100+90+rnd(5,9);b=rnd(0,1)*100+rnd(1,9)*10+rnd(5,9)} // 연달아 받아올림 (6.97 + 1.36)

  GBC_PAL.forEach((c,k)=>{const dr=r-c[0],dg=g-c[1],db=b-c[2],d=dr*dr*3+dg*dg*4+db*db*2;if(d<bd){bd=d;best=k}});
  const c=GBC_PAL[best];LUT[i]=(255<<24)|(c[2]<<16)|(c[1]<<8)|c[0]}

/* ================= 이동 ================= */
const npcAt=(x,y)=>npcs.find(n=>n.map===S.map&&n.cx===x&&n.cy===y);
function walkable(x,y){const m=MAPS[S.map];return m.walk.has(tileAt(m,x,y))&&!npcAt(x,y)}
let last=performance.now();
function loop(now){
  SND.music(trackNow());
  const dt=Math.min(50,now-last);last=now;frame++;
  if(mode==='walk'){
    if(moving){moving.t+=dt/((RM?120:170)*(moving.jump?2:1));if(moving.t>=1){S.x=moving.tx;S.y=moving.ty;moving=null;stepCount++;arrive()}}
    if(!moving&&mode==='walk'&&held)tryMove(held);
  }
  if(B){const d=dt/1000*Math.max(6,B.max*.9);B.shownE+=Math.sign(B.hp-B.shownE)*Math.min(Math.abs(B.hp-B.shownE),d)}
  const dh=dt/1000*24;shownHp+=Math.sign(S.hp-shownHp)*Math.min(Math.abs(S.hp-shownHp),dh);
  draw(now);requestAnimationFrame(loop);
}
function tryMove(dir){
  S.dir=dir;const [dx,dy]=DIRS[dir],nx=S.x+dx,ny=S.y+dy;
  if(walkable(nx,ny)){moving={fx:S.x,fy:S.y,tx:nx,ty:ny,t:0};return}
  if(dir==='down'&&tileAt(MAPS[S.map],nx,ny)==='L'&&walkable(nx,ny+1)){moving={fx:S.x,fy:S.y,tx:nx,ty:ny+1,t:0,jump:true};sfx('jump');return}
  if(performance.now()-lastBump<450)return;lastBump=performance.now();
  {const m=MAPS[S.map],tt=tileAt(m,nx,ny);if(!npcAt(nx,ny)&&tt!=='S'&&tt!=='Z')sfx('bump')}
  interactAt(nx,ny,true);
}
function signText(x,y){
  if(y===14&&x===17)return['연못 낚시터','물을 바라보고 A 버튼을 누르면 낚시를 할 수 있어요.','이 연못에는 소수붕어가 산대요!'];
  if(x===12)return['소수 마을 안내판','풀숲을 걸으면 몬스터가 나와요. 문제를 맞히면 공격!','몬스터 4마리를 모으면 북쪽 체육관 문이 열려요.'];
  if(x<12)return['← 초록 풀숲','소수 한 자리 몬스터가 살아요.','예: 2.7 + 1.5'];
  return['청록 풀숲 →','소수 두 자리 몬스터가 살아요.','예: 3.5 + 1.27'];
}
function interactAt(x,y,bump){
  const m=MAPS[S.map],t=tileAt(m,x,y),n=npcAt(x,y);
  if(n&&n.talk){n.cdir=OPP[S.dir];momTalk();return}
  if(n){if(n.beaten){n.cdir=OPP[S.dir];say(n.after)}else spotted(n,true);return}
  if(t==='S')say(signText(x,y));
  if(t==='~'&&S.map==='town'&&!bump){goFishing(x,y);return}
  if(t==='Z'){const p=m.props.find(p=>p.kind!=='rug'&&x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h);if(p)propTalk(p)}
}

  tv:['TV에서 일기예보가 나온다.','"오늘 소수 마을의 비 올 확률은 0.1, 기온은 18.5도입니다."'],

  table:['식탁 위에 우유와 케이크가 있다.','케이크가 0.5조각 남았다.'],chairL:['폭신한 의자다.'],chairR:['폭신한 의자다.']};

async function propTalk(p){if(p.kind==='pc'){await say(['컴퓨터를 켰다.','몬스터 도감과 풀이 기록을 열어 볼까?']);openDex();return}if(PROP_TEXT[p.kind])say(PROP_TEXT[p.kind])}
let momMet=false;
async function momTalk(){
  mode='busy';
  if(!momMet&&!S.dex.length){await say(['엄마: 일어났구나! 오늘부터 소수 마을 탐험을 떠난다며?','풀숲 몬스터들은 소수 계산 문제를 낸대.','소수점끼리 줄을 맞춰서 계산하는 거 잊지 마!','힘들 땐 언제든 집에 와서 쉬렴. 다녀오렴!'])}
  else{await say(['엄마: 어서 와! 많이 힘들었지?','잠깐 쉬었다 가렴.'])}
  momMet=true;S.hp=S.maxHp;shownHp=S.hp;save();sfx('heal');await say(['체력이 모두 회복되었다!']);mode='walk';

function arrive(){
  const m=MAPS[S.map],t=tileAt(m,S.x,S.y);
  if(S.map==='town'){
    if(t==='D')return enterGym();
    if(t==='R')return healCenter();
    if(t==='E')return changeMap('home',4,7,'up');
    if(t==='"'||t===';'){
      if(safe>0){safe--}else if(Math.random()<.15){const z=t==='"'?1:2,list=SPECIES.filter(s=>s.zone===z);held=null;wildBattle(list[rnd(0,list.length-1)]);return}
    }else if(safe>0)safe--;
  }else if(S.map==='home'){
    if(t==='m')return changeMap('town',3,14,'down');
  }else{
    if(t==='M')return exitGym();
    const n=npcs.find(n=>n.map===S.map&&!n.talk&&!n.beaten&&sees(n));if(n){held=null;spotted(n,false);return}
  }
  save();
}
function sees(n){const [dx,dy]=DIRS[n.cdir];let x=n.cx,y=n.cy;for(let i=0;i<n.range;i++){x+=dx;y+=dy;if(x===S.x&&y===S.y)return true;const m=MAPS[S.map];if(!m.walk.has(tileAt(m,x,y))||npcAt(x,y))return false}return false}

/* ================= 대화 ================= */
function say(lines){
  return new Promise(res=>{
    const prev=mode;mode='dialog';held=null;
    const all=[];lines.forEach(l=>all.push(...wrap(l,276,20)));
    const pages=[];for(let i=0;i<all.length;i+=2)pages.push(all.slice(i,i+2));
    dlg={pages,i:0,done:()=>{dlg=null;mode=prev==='dialog'?'walk':prev;res()}};
  });
}
function advance(){if(!dlg)return;if(dlg.i<dlg.pages.length-1)dlg.i++;else dlg.done()}

  mode='busy';held=null;sfx('door');await fadeOut();
  S.map=map;S.x=x;S.y=y;S.dir=dir;moving=null;if(map==='gym')resetNpcs();

}
async function enterGym(){
  if(S.dex.length<4){S.y+=1;S.dir='down';await say(['체육관 문이 잠겨 있어요.',`몬스터를 4마리 모아야 열려요. (지금 ${S.dex.length}마리)`]);return}
  await changeMap('gym',5,11,'up');

async function healCenter(){
  mode='busy';held=null;await fadeOut();S.x=15;S.y=14;S.dir='down';S.hp=S.maxHp;shownHp=S.hp;save();await fadeIn();mode='walk';sfx('heal');

/* ================= 트레이너 ================= */
function npcStep(n,dx,dy){n.anim={fx:n.cx,fy:n.cy,t:0};n.cx+=dx;n.cy+=dy;return tween(v=>{if(n.anim)n.anim.t=v},0,1,200).then(()=>{n.anim=null;n.steps=(n.steps||0)+1})}
function dirTo(fx,fy,tx,ty){return Math.abs(tx-fx)>Math.abs(ty-fy)?(tx>fx?'right':'left'):(ty>fy?'down':'up')}
async function spotted(n,talked){
  mode='busy';held=null;
  if(!talked){n.bang=true;sfx('alert');await sleep(RM?200:700);n.bang=false;const [dx,dy]=DIRS[n.cdir];
    while(Math.abs(S.x-n.cx)+Math.abs(S.y-n.cy)>1)await npcStep(n,dx,dy);}
  n.cdir=dirTo(n.cx,n.cy,S.x,S.y);S.dir=OPP[n.cdir];
  await say(n.before);mode='busy';
  const r=await runBattle({kind:n.leader?'boss':'trainer',trainer:n,sp:SPMAP[n.sp],hp:n.leader?70:(n.lvl==='mix'?34:40)});
  if(r==='lose')return afterLose();
  n.beaten=true;if(!S.beaten.includes(n.id))S.beaten.push(n.id);
  const lines=[...n.after];
  if(n.leader){S.badge=true;lines.push('소수 배지를 받았다!')}
  lines.push(...gainExp(n.leader?3:2));
  save();await fadeIn();await say(lines);mode='walk';save();
}
function gainExp(k){const before=S.lv;S.exp+=k;S.lv=1+Math.floor(S.exp/3);if(S.lv>before){setTimeout(()=>sfx('levelup'),900);S.maxHp+=5*(S.lv-before);S.hp=S.maxHp;return[`레벨이 올라 Lv.${S.lv}이 되었다! 체력이 늘었다.`]}return[]}
async function wildBattle(sp){
  mode='busy';
  const r=await runBattle({kind:'wild',sp,hp:sp.zone===1?20:sp.zone==='water'?22:26});
  if(r==='lose')return afterLose();
  const lines=[];
  if(r==='win'){const first=!S.dex.includes(sp.id);if(first)S.dex.push(sp.id);
    lines.push(first?`${josa(sp.name,'이','가')} 도감에 새로 등록되었다!`:`${josa(sp.name,'을','를')} 또 이겼다!`);
    lines.push(...gainExp(1));
    if(first&&S.dex.length===4&&!S.badge)lines.push('몬스터 4마리를 모았다! 북쪽 체육관 문이 열렸다.');}
  safe=2;save();await fadeIn();if(lines.length)await say(lines);mode='walk';
}
async function afterLose(){
  S.map='town';S.x=15;S.y=14;S.dir='down';S.hp=S.maxHp;shownHp=S.hp;resetNpcs();save();
  await fadeIn();await say(['회복센터로 돌아와 체력을 회복했다.','틀린 문제는 소수점을 세로로 맞춰서 다시 도전해 보자!']);mode='walk';
}

function wait(ms){return new Promise(res=>{const t=setTimeout(()=>{waiter=null;res()},ms);waiter=()=>{clearTimeout(t);waiter=null;res()}})}
async function bmsg(text,ms=1500){B.phase='msg';B.msg=text;await wait(ms)}
function choose(){return new Promise(res=>{B.phase='choose';B.res=res})}
function pick(i){if(B&&B.phase==='choose'){sfx('select');B.phase='busy';B.cursor=i;B.res(i)}}
async function runBattle(o){
  mode='battle';held=null;moving=null;
  sfx('encounter');for(let i=0;i<3;i++){flash=1;await sleep(RM?20:70);flash=0;await sleep(RM?20:70)}
  await tween(v=>wipe=v,0,1,420);
  shownHp=S.hp;
  B={...o,max:o.hp,shownE:o.hp,streak:0,pops:[],phase:'msg',msg:'',cursor:0,p:null,hint:false,reveal:false,showExpr:false,eOff:80,pOff:-80,eDrop:0,blinkUntil:0,shakeUntil:0};
  wipe=0;fade=1;await tween(v=>fade=v,1,0,220);
  await tween(v=>{B.eOff=80*(1-v);B.pOff=-80*(1-v)},0,1,520);
  if(o.kind==='wild')await bmsg(`야생의 ${josa(o.sp.name,'이','가')} 나타났다! (난이도 ${o.sp.zone===2?'★★☆☆':o.sp.zone==='water'?'★☆☆☆~★★☆☆':'★☆☆☆'})`);
  else{await bmsg(`${josa(o.trainer.name,'이','가')} 승부를 걸어왔다!`);await bmsg(`${josa(o.trainer.short,'은','는')} ${josa(o.sp.name,'을','를')} 내보냈다!`);await bmsg(o.kind==='boss'?'관장 배틀! 난이도 ★★★★ 빈칸 문제도 나온다!':'트레이너 배틀! 난이도 ★★★☆',1400)}
  while(true){
    const lvl=o.kind==='boss'?(Math.random()<.25?3:4):o.kind==='trainer'?(o.trainer.lvl==='mix'?(Math.random()<.5?2:3):3):o.sp.zone==='water'?(Math.random()<.5?1:2):o.sp.zone;
    B.p=makeProblem(lvl);B.hint=false;B.reveal=false;B.showExpr=false;B.cursor=0;B.qStart=0;let retried=false;
    let solved=false;
    while(!solved){
      if(!B.qStart)B.qStart=performance.now();
      const i=await choose();
      if(i==='flee'){B.showExpr=false;await bmsg('무사히 도망쳤다!',1100);return endBattle('flee')}
      const v=B.p.choices[i];B.showExpr=true;
      if(v===B.p.ans){
        S.correct++;solved=true;B.reveal=true;B.hint=false;sfx('correct');setTimeout(()=>sfx('hit'),280);
        const secs=(performance.now()-B.qStart)/1000;B.streak=retried?0:B.streak+1;
        let dmg=8+2*(S.lv-1),notes=[];
        const tier=retried?null:secs<5?[1.5,'번개처럼 빠른 정답! 효과가 굉장했다!']:secs<10?[1.2,'빠른 정답! 효과가 좋았다!']:secs<20?[1,'']:[.8,'천천히 풀었더니 공격이 조금 약했다.'];
        if(retried){dmg*=.5;notes.push('힌트를 보고 맞혔다! (데미지 절반)')}
        else{dmg*=tier[0];if(tier[1])notes.push(tier[1])}
        if(B.streak>=2){dmg+=Math.min(6,2*(B.streak-1));notes.push(`${B.streak}연속 정답 보너스!`)}
        dmg=Math.max(1,Math.round(dmg*(0.9+Math.random()*.2)));
        B.hp=Math.max(0,B.hp-dmg);B.blinkUntil=performance.now()+(RM?0:520);
        B.pops.push({t:'-'+dmg,x:256,y:70,t0:performance.now(),c:!retried&&secs<5?'#e2604a':!retried&&secs<10?'#d88a20':'#3b2f4a'});
        await bmsg(`정답! (${secs.toFixed(1)}초) ${josa(B.sp.name,'에게','에게')} ${dmg}의 데미지!`,1300);
        for(const n of notes)await bmsg(n,1000);
      }else{
        S.wrong++;sfx('wrong');setTimeout(()=>sfx('hurt'),300);retried=true;B.streak=0;
        const rg=o.kind==='boss'?[8,12]:o.kind==='trainer'?[6,9]:o.sp.zone===2?[5,7]:[4,6],edmg=rnd(rg[0],rg[1]);
        S.hp=Math.max(0,S.hp-edmg);updateHud();
        B.shakeUntil=performance.now()+(RM?0:380);
        B.pops.push({t:'-'+edmg,x:110,y:150,t0:performance.now(),c:'#d84830'});
        await bmsg(`${fmt(v)}은(는) 아니야! ${josa(B.sp.name,'의','의')} 반격! ${edmg}의 데미지!`,1600);
        if(S.hp<=0){B.showExpr=false;B.hint=false;await bmsg('체력이 바닥났다… 눈앞이 캄캄해졌다!',1700);return endBattle('lose')}
        B.hint=true;B.p.choices=shuffle(B.p.choices);
        await bmsg('세로셈 힌트를 보고 다시 풀어 보자!',1300);
      }
    }
    if(B.hp<=0){
      B.showExpr=false;sfx('faint');await tween(v=>B.eDrop=v,0,44,380);sfx(o.kind==='wild'?'catch':'victory');
      if(o.kind==='wild')await bmsg(`${josa(o.sp.name,'을','를')} 잡았다!`,1500);
      else{await bmsg(`${josa(o.sp.name,'은','는')} 쓰러졌다!`,1200);await bmsg(`${o.trainer.name}에게 이겼다!`,1500)}
      return endBattle('win');
    }
  }
}
async function endBattle(r){B.phase='busy';await fadeOut();B=null;fade=1;mode='busy';save();return r}

/* ================= 소리 (Web Audio로 직접 만든 칩튠, 외부 파일 없음) ================= */
const SND=(()=>{
  let ctx=null,master=null,mus=null,fx=null,P25=null,P50=null,NB=null,timer=null,on=true;
  try{on=localStorage.getItem('sosu-sound')!=='0'}catch(e){}
  const N={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const hz=s=>{const m=s.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,((+m[2]+1)*12+N[m[1]]-69)/12)};
  function pulse(d){const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);return ctx.createPeriodicWave(re,im)}
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume().catch(()=>{});return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){return}
    master=ctx.createGain();master.gain.value=on?.55:0;master.connect(ctx.destination);
    mus=ctx.createGain();mus.gain.value=.3;mus.connect(master);fx=ctx.createGain();fx.gain.value=.55;fx.connect(master);
    P25=pulse(.25);P50=pulse(.5);
    NB=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    timer=setInterval(tick,25);
  }
  function tone(t,f,dur,o={}){
    const os=ctx.createOscillator(),g=ctx.createGain(),v=o.vol??.25;
    if(o.wave==='tri')os.type='triangle';else os.setPeriodicWave(o.wave==='sq'?P50:P25);
    os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.setValueAtTime(v,t+Math.max(.01,dur*.7));g.gain.linearRampToValueAtTime(0,t+dur);
    os.connect(g);g.connect(o.dest||fx);os.start(t);os.stop(t+dur+.02);
  }
  function noise(t,dur,o={}){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain(),v=o.vol??.2;
    s.buffer=NB;f.type='highpass';f.frequency.value=o.hp||1200;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(o.dest||fx);s.start(t);s.stop(t+dur+.02);
  }
  /* 배경음악: 8분음표 32칸(4마디) 반복. '-'는 앞 음 늘이기, '.'는 쉼표 */
  const T={
    title:{bpm:132,lead:'P',mel:'E5 - G5 - C6 - B5 A5 G5 - E5 - D5 - . . F5 - A5 - D6 - C6 B5 C6 - - - . . . .',
      bass:'C3 . G3 . C3 . G3 . A2 . E3 . A2 . E3 . F2 . C3 . G2 . D3 . C3 . G2 . C3 . . .'},
    town:{bpm:108,lead:'P',mel:'A4 - C5 - F5 - E5 - D5 - C5 - A4 - - - A#4 - D5 - G5 - F5 - E5 - C5 - G4 - - -',
      bass:'F2 . C3 . F2 . C3 . D2 . A2 . D2 . A2 . A#1 . F2 . A#1 . F2 . C2 . G2 . C2 . E2 .'},
    home:{bpm:96,lead:'T',mel:'C6 . E6 . G6 . E6 . F6 . A6 . G6 . E6 . D6 . F6 . E6 . C6 . D6 . B5 . C6 - - .',
      bass:'C4 - - - G3 - - - F3 - - - C4 - - - G3 - - - C4 - - - G3 - - - C3 - - -'},
    gym:{bpm:120,lead:'P',mel:'D5 - F5 - A5 - D6 - C6 - A5 - F5 - - - A#5 - A5 - G5 - F5 - E5 - C#5 - A4 - - -',
      bass:'D3 . D3 . A2 . A2 . F2 . F2 . C3 . C3 . A#2 . A#2 . G2 . G2 . A2 . A2 . A2 . C#3 .',drum:'k . s . k . s . k . s . k . s . k . s . k . s . k . s . k k s .'},
    battle:{bpm:160,lead:'P',mel:'A5 . A5 C6 . A5 E5 . G5 . G5 B5 . G5 D5 . F5 . F5 A5 . F5 C5 . E5 . G#5 . B5 . E6 .',
      bass:'A2 A3 A2 A3 A2 A3 A2 A3 G2 G3 G2 G3 G2 G3 G2 G3 F2 F3 F2 F3 F2 F3 F2 F3 E2 E3 E2 E3 E2 E3 G#2 B2',drum:'k h s h k h s h k h s h k h s h k h s h k h s h k h s h k k s s'},
    boss:{bpm:172,lead:'P',mel:'E5 G5 B5 E6 D6 B5 G5 B5 C6 B5 A5 G5 F#5 G5 A5 F#5 E5 G5 B5 E6 F#6 E6 D6 B5 C6 - B5 - A5 - F#5 -',
      bass:'E2 E3 E2 E3 E2 E3 E2 E3 C2 C3 C2 C3 D2 D3 D2 D3 E2 E3 E2 E3 E2 E3 E2 E3 A1 A2 A1 A2 B1 B2 B1 B2',drum:'k h s h k k s h k h s h k k s h k h s h k k s h k h s h k s s s'}
  };
  const parse=str=>{const tk=str.trim().split(/\s+/),ev=[];tk.forEach((x,i)=>{if(x==='-'){if(ev.length)ev[ev.length-1].len++}else if(x!=='.')ev.push({i,n:x,len:1})});return{ev,len:tk.length}};
  for(const k in T){const t=T[k];t.m=parse(t.mel);t.b=parse(t.bass);t.d=t.drum?t.drum.trim().split(/\s+/):null}
  let cur=null,step=0,nextT=0,hold=0;
  function tick(){
    if(!ctx||!cur)return;const t=T[cur],sp=60/t.bpm/2;
    while(nextT<ctx.currentTime+.12){
      if(nextT>=hold){
        for(const e of t.m.ev)if(e.i===step)tone(nextT,hz(e.n),sp*e.len*.95,{wave:t.lead==='T'?'tri':'p25',vol:t.lead==='T'?.32:.15,dest:mus});
        for(const e of t.b.ev)if(e.i===step)tone(nextT,hz(e.n),sp*e.len*.9,{wave:'tri',vol:.3,dest:mus});
        const dr=t.d&&t.d[step%t.d.length];
        if(dr==='k')tone(nextT,140,.09,{wave:'tri',to:45,vol:.45,dest:mus});
        if(dr==='s')noise(nextT,.09,{vol:.16,hp:1800,dest:mus});
        if(dr==='h')noise(nextT,.03,{vol:.07,hp:6000,dest:mus});
      }
      step=(step+1)%t.m.len;nextT+=sp;
    }
  }
  function music(name){if(name===cur)return;cur=name;step=0;if(ctx)nextT=ctx.currentTime+.06}
  function seq(notes,gap,o){if(!ctx)return 0;let t=ctx.currentTime+.01;notes.forEach(([n,l])=>{if(n)tone(t,hz(n),gap*l*.95,o);t+=gap*l});return t-ctx.currentTime}
  function jingle(notes,gap){const d=seq(notes,gap,{wave:'p25',vol:.22});if(ctx)hold=Math.max(hold,ctx.currentTime+d+.15)}
  const S_={
    cursor:()=>tone(ctx.currentTime,1320,.035,{wave:'sq',vol:.12}),
    select:()=>{const t=ctx.currentTime;tone(t,988,.05,{vol:.18});tone(t+.05,1319,.08,{vol:.18})},
    blip:()=>tone(ctx.currentTime,880,.03,{wave:'sq',vol:.08}),
    bump:()=>tone(ctx.currentTime,110,.07,{wave:'sq',vol:.18,to:70}),
    jump:()=>tone(ctx.currentTime,330,.18,{vol:.18,to:880}),
    door:()=>{const t=ctx.currentTime;tone(t,660,.07,{vol:.15});tone(t+.07,440,.07,{vol:.15});tone(t+.14,330,.12,{vol:.15})},
    alert:()=>{const t=ctx.currentTime;tone(t,1568,.06,{vol:.2});tone(t+.08,1568,.1,{vol:.2})},
    encounter:()=>{const t=ctx.currentTime;for(let i=0;i<10;i++)tone(t+i*.035,hz(['C5','E5','G5','C6','E6'][i%5])*(i<5?1:2),.04,{vol:.14})},
    correct:()=>seq([['C6',1],['E6',1],['G6',1],['C7',2]],.06,{wave:'p25',vol:.22}),
    wrong:()=>{const t=ctx.currentTime;tone(t,220,.16,{wave:'sq',vol:.18,to:150});tone(t+.17,150,.22,{wave:'sq',vol:.18,to:90})},
    hit:()=>{const t=ctx.currentTime;noise(t,.14,{vol:.3,hp:600});tone(t,440,.12,{wave:'sq',vol:.14,to:110})},
    hurt:()=>{const t=ctx.currentTime;noise(t,.22,{vol:.32,hp:300})},
    faint:()=>tone(ctx.currentTime,660,.45,{wave:'sq',vol:.16,to:80}),
    victory:()=>jingle([['G5',1],['G5',1],['G5',1],['C6',3],['A#5',1],['C6',1],['D6',1],['E6',4]],.09),
    levelup:()=>jingle([['C6',1],['E6',1],['G6',1],['C7',1],['G6',1],['C7',3]],.08),
    heal:()=>jingle([['C6',1],['E6',1],['G6',2],['E6',1],['G6',1],['C7',3]],.11),
    cast:()=>{const t=ctx.currentTime;noise(t,.25,{vol:.12,hp:2500});tone(t+.22,520,.08,{wave:'sq',vol:.1,to:300})},
    catch:()=>jingle([['E6',1],['C6',1],['E6',1],['G6',3]],.08)
  };
  return{
    init,music,
    play(n){if(!ctx||!on||!S_[n])return;try{S_[n]()}catch(e){}},
    get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('sosu-sound',on?'1':'0')}catch(e){}init();if(master)master.gain.value=on?.55:0;return on}
  };
})();
const sfx=n=>SND.play(n);
function trackNow(){if(mode==='title'||mode==='select')return'title';if(B)return B.kind==='boss'?'boss':'battle';return S.map==='home'?'home':S.map==='gym'?'gym':'town'}
function press(btn){
  SND.init();
  if(mode==='title'){if(btn==='a'||btn==='b'){sfx('select');begin()}return}
  if(mode==='select'){if(btn==='left'||btn==='right'||btn==='up'||btn==='down'){selIdx^=1;sfx('cursor')}else if(btn==='a'){sfx('select');confirmSelect()}return}
  if(!$('#modal').hidden){if(btn==='a'||btn==='b')closeModal();return}
  if(mode==='dialog'){if(btn==='a'||btn==='b'){sfx('blip');advance()}return}
  if(mode==='battle'&&B){
    if(B.phase==='msg'){if((btn==='a'||btn==='b')&&waiter)waiter();return}
    if(B.phase==='choose'){
      if(btn==='left'||btn==='right'){B.cursor^=1;sfx('cursor')}
      else if(btn==='up'||btn==='down'){B.cursor^=2;sfx('cursor')}
      else if(btn==='a')pick(B.cursor);
      else if(btn==='b'&&B.kind==='wild'){B.phase='busy';B.res('flee')}
      else if(btn==='b'){B.msg='트레이너와의 승부에서는 도망칠 수 없어!';B.phase='msg';const back=()=>{if(B)B.phase='choose'};wait(1300).then(back)}
    }
    return;
  }
  if(mode==='walk'){
    if(btn==='a'&&!moving){const [dx,dy]=DIRS[S.dir];interactAt(S.x+dx,S.y+dy)}
    else if(DIRS[btn]&&!moving)tryMove(btn);
  }
}
const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{
  SND.init();
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KEY[k]){if(mode==='walk'||!e.repeat)press(KEY[k]);held=KEY[k];e.preventDefault();return}
  if(k===' '||k==='Enter'||k==='z'){if(!e.repeat)press('a');e.preventDefault();return}
  if(k==='x'||k==='Escape'||k==='Backspace'){if(!e.repeat)press('b');e.preventDefault();return}
  if(mode==='battle'&&B&&B.phase==='choose'&&k>='1'&&k<='4'){pick(+k-1);e.preventDefault()}
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(KEY[k]===held)held=null});
document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.dir;
  b.addEventListener('pointerdown',e=>{e.preventDefault();held=d;b.classList.add('on');press(d)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(held===d)held=null;b.classList.remove('on')}));
});
$('#aBtn').addEventListener('pointerdown',e=>{e.preventDefault();press('a')});
$('#bBtn').addEventListener('pointerdown',e=>{e.preventDefault();press('b')});
scr.addEventListener('pointerdown',e=>{
  SND.init();
  if(mode==='title'){begin();return}
  if(mode==='select'){const r0=scr.getBoundingClientRect();selIdx=(e.clientX-r0.left)/r0.width<.5?0:1;confirmSelect();return}
  const r=scr.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*LW,y=(e.clientY-r.top)/r.height*LH;
  if(mode==='dialog'){advance();return}
  if(mode==='battle'&&B){
    if(B.phase==='msg'){if(waiter)waiter();return}
    if(B.phase==='choose'&&y>=112){pick((y<128?0:2)+(x<80?0:1))}
  }
});

function openHelp(){
  openModal(`<h2>하는 법</h2><ul>
  <li>방향 버튼으로 걷고, <b>A</b>로 표지판을 읽거나 사람에게 말을 걸어요.</li>

  <li>회복센터 옆 연못을 바라보고 <b>A</b>를 누르면 <b>낚시</b>를 해요. 물속 몬스터가 걸릴 수 있어요.</li>

  <li>문제를 3번 맞히면 몬스터를 잡아요. 틀리면 체력이 줄고 <b>소수점을 맞춘 세로셈 힌트</b>가 나와요.</li>
  <li>체력이 줄면 회복센터나 집(엄마)에서 쉬어요.</li>
  <li>난이도: 초록 풀숲 ★ → 청록 풀숲 ★★ → 견습생 트레이너 ★★★ → 관장 ★★★★. 뒤로 갈수록 몬스터 체력이 많고, 틀렸을 때 받는 데미지도 커요.</li>
  <li>데미지: 레벨이 오를수록 세져요. <b>고민한 시간</b>에 따라 달라져요: 5초 안 1.5배, 10초 안 1.2배, 20초 안 1배, 그보다 오래 걸리면 0.8배. 문제 위의 시간 막대로 확인할 수 있어요., <b>연속으로 맞히면 보너스</b>, 힌트를 보고 맞히면 절반이에요.</li>
  <li>몬스터 4마리를 모으면 북쪽 체육관이 열려요. 견습생 두 명의 눈에 띄면 승부가 시작되고, 맨 안쪽에서 관장 점박사가 기다려요.</li></ul>
  <p class="sub">선생님께: 틀린 보기는 '소수점 위치를 맞추지 않은 계산', '받아올림·받아내림 빠뜨림' 같은 흔한 실수로 만들어져요. 진행 상황은 이 기기의 브라우저에 저장돼요.</p>
  <p class="sub">마을 타일: Kenney Tiny Town (CC0, kenney.nl) · 몬스터: Tiny Creatures, Clint Bellanger (CC0)</p>
  <div class="row-btns"><button class="reset" id="qrBtn" type="button">학생용 QR 코드</button><button class="reset" id="genBtn" type="button">주인공: ${S.gender==='girl'?'여자아이':'남자아이'} (바꾸기)</button><button class="reset" id="gbcBtn" type="button">게임보이 컬러 색감: ${gbcOn?'켜짐':'꺼짐'}</button><button class="reset" id="resetBtn" type="button">처음부터 다시</button><button class="close" id="closeBtn" type="button">닫기</button></div>`);
  $('#qrBtn').onclick=openQR;
  const gn=$('#genBtn');gn.onclick=()=>{S.gender=S.gender==='girl'?'boy':'girl';save();gn.textContent='주인공: '+(S.gender==='girl'?'여자아이':'남자아이')+' (바꾸기)'};
  const gb=$('#gbcBtn');gb.onclick=()=>{gbcOn=!gbcOn;try{localStorage.setItem('sosu-gbc',gbcOn?'1':'0')}catch(e){}gb.textContent='게임보이 컬러 색감: '+(gbcOn?'켜짐':'꺼짐')};
  const rb=$('#resetBtn');rb.onclick=()=>{if(!rb.classList.contains('armed')){rb.classList.add('armed');rb.textContent='한 번 더 누르면 기록이 지워져요';return}
    S=JSON.parse(JSON.stringify(DEF));momMet=false;resetNpcs();shownHp=S.hp;B=null;dlg=null;titleSaved=false;selIdx=0;save();closeModal();mode='select'};
}

/* 학생용 QR 코드 */
let qrLib=null;
function loadQR(){if(window.qrcode)return Promise.resolve();if(qrLib)return qrLib;qrLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});return qrLib}
function openQR(){
  const url=location.href.split('#')[0];
  openModal(`<h2>학생용 QR 코드</h2><p class="sub">학생들이 태블릿 카메라로 찍으면 바로 게임이 열려요. 칠판 화면에 띄워 주세요.</p>
    <div id="qrBox" style="display:flex;justify-content:center;margin:14px 0"><p>QR 코드를 만드는 중이에요…</p></div>
    <p style="word-break:break-all;font-family:var(--f-mono);font-size:13px;background:#eeeadc;padding:8px;border-radius:6px" id="qrUrl"></p>
    ${/claude\.ai|claudeusercontent/.test(location.host)?'<p class="sub">지금 주소는 Claude 링크예요. 공유를 켜 두면 학생들도 열 수 있지만, 앱 설치와 오프라인 플레이는 GitHub Pages 주소에서만 돼요.</p>':''}
    <div class="row-btns"><button class="close" id="closeBtn" type="button">닫기</button></div>`);
  $('#qrUrl').textContent=url;
  loadQR().then(()=>{const q=qrcode(0,'M');q.addData(url);q.make();const img=document.createElement('img');img.src=q.createDataURL(8,16);img.alt='게임 주소 QR 코드';img.style.cssText='width:min(280px,70vw);image-rendering:pixelated;border:2px solid var(--ink);border-radius:8px';$('#qrBox').replaceChildren(img)})
    .catch(()=>{$('#qrBox').innerHTML='<p>QR 코드를 만들지 못했어요. 인터넷 연결을 확인해 주세요. 아래 주소를 직접 알려 주셔도 돼요.</p>'});
}

/* ================= 화면 크기 ================= */
function fit(){
  const land=matchMedia('(orientation:landscape) and (max-height:820px)').matches;
  const bz=$('#bezel'),cs=getComputedStyle(bz),dv=$('.device'),dcs=getComputedStyle(dv);
  let availW;
  if(land){availW=Math.min(innerWidth*.62,dv.clientWidth-parseFloat(dcs.paddingLeft)-parseFloat(dcs.paddingRight)-220)-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)}
  else availW=bz.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const top=scr.getBoundingClientRect().top+scrollY;
  const availH=innerHeight-(top-scrollY+Math.max(0,scrollY))-(land?44:270);
  let s=Math.min(availW/160,Math.max(availH,144*1.2)/144);
  s=s>=2?Math.floor(s):Math.max(1,s);
  scr.style.width=Math.floor(160*s)+'px';scr.style.height=Math.floor(144*s)+'px';
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(document.fonts)document.fonts.ready.then(fit);

/* ================= 시작 ================= */
let titleSaved=false;

  if(!titleSaved){mode='busy';fadeOut().then(()=>{mode='select';selIdx=S.gender==='girl'?1:0;return fadeIn()});return}

function confirmSelect(){

  fadeOut().then(()=>{banner={text:MAPS[S.map].name,until:performance.now()+1800};return fadeIn()}).then(()=>{mode='walk';S.dir='left';momTalk()});
}
function start(data){
  const saved=(data&&data.S)||load();
  if(saved)S=Object.assign(JSON.parse(JSON.stringify(DEF)),saved);
  resetNpcs();shownHp=S.hp;fit();updateHud();
  if(document.fonts){document.fonts.load('20px "Do Hyeon"','소수마을가나다라').then(()=>tcache.clear(),()=>{});document.fonts.load('700 20px "IBM Plex Mono"','0123456789.').then(()=>tcache.clear(),()=>{})}
  requestAnimationFrame(loop);
  mode='title';titleSaved=!!saved;
}

}
